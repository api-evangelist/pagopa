aid: pagopa
name: PagoPA
description: PagoPA S.p.A. is the Italian state-owned company (owned by the State through the Ministry of Economy and Finance, supervised by the
  Presidency of the Council of Ministers) whose mission is to design and build the State's digital infrastructure for public digital services.
  Its products include the pagoPA payments platform, the IO public services app, SEND (digital notifications), the National Digital Data Platform
  (PDND Interoperability), PARI, Check IBAN and the European Digital Identity Wallet, with APIs and guides published on its Developer Portal (developer.pagopa.it)
  and docs.pagopa.it.
