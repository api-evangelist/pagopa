      properties:
        recIndex:
          type: integer
          description: Index destinatario notifica digitale
          format: int32
        legalfactId:
          type: string
          description: Identificativo dell'atto opponibile a terzi del quale è stata richiesta la creazione
        eventTimestamp:
          type: string
          description: Data ricezione richiesta visualizzazione notifica
          format: date-time
        raddType:
          $ref: '#/components/schemas/RaddType'
        raddTransactionId:
          $ref: '#/components/schemas/RaddTransactionId'
        delegateInfo:
          $ref: '#/components/schemas/DelegateInfo'
    NotificationRequestAcceptedDetailsV27:
      type: object
      properties:
        recIndex:
          type: integer
          description: Index destinatario notifica digitale
          format: int32
        notificationRequestId:
          type: string
          description: identificativo univoco di una richiesta di invio notifica, non è lo IUN
        paProtocolNumber:
          type: string
          description: Numero di protocollo associato alla notifica, può essere riutilizzato per rettifiche.
          pattern: ^.*$
          maxLength: 256
        idempotenceToken:
          type: string
          description: token usato per disambiguare "richieste di notificazione" effettuate con lo stesso  numero di protocollo.
          pattern: ^[ -~]*$
          maxLength: 256
    PaFeeV21:
      type: integer
      description: Costo espresso in eurocent che la PA imputa per la notifica. <br/> Obbligatoria per notifiche con notificationFeePolicy=DELIVERY_MODE e modalità di integrazione Async o modalità di pagamento F24.<br/> Il default nei casi di non obbligatorietà è 100 <br/> Esempio paFee ad 1€ -> 100 <br/>
      format: int32
