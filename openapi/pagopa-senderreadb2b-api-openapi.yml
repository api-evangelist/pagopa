    NotificationRefusedErrorV25:
      type: object
      properties:
        errorCode:
          type: string
          maxLength: 128
          description: "Errori di rifiuto della notifica.\n  - FILE_NOTFOUND - I riferimenti dei documenti nella notifica non sono corretti o i documenti non sono stati caricati con successo.\n  - FILE_GONE - Allegato non disponibile: superati i termini di conservazione\n  - FILE_SHA_ERROR - Il digest calcolato con algoritmi sha256 dei documenti inseriti non è corrispondete a quello del file referenziato.\n  - FILE_PDF_INVALID_ERROR - Il file inserito non è in formato pdf.\n  - FILE_PDF_TOOBIG_ERROR - Il file pdf ha una dimensione eccedente il limite di 200MB.\n  - F24_METADATA_NOT_VALID - I dati contenuti del file dei metadati F24 non rispettano lo schema di validazione.\n  - TAXID_NOT_VALID - Codice fiscale del destinatario non corretto (non ancora implementato).\n  - RECIPIENT_ID_NOT_VALID - Destinatario non Valido (utilizzato solo per funzionalità non ancora implementate)\n  - NOT_VALID_ADDRESS - L'indirizzo di invio cartaceo inserito per il destinatario non ha superato i controlli di correttezza.\n  - PAYMENT_NOT_VALID - I dati del pagamento non sono sono registrati sulla piattaforma GPD (modalità asincrona di integrazione pagoPA)\n  - SERVICE_UNAVAILABLE - Il sistema non è attualmente disponibile.\n  ..."
        detail:
          type: string
          maxLength: 2048
    SentNotification:
      description: Le informazioni riguardanti una richiesta di notifica accettata
      allOf:
      - $ref: '#/components/schemas/NewNotificationRequest'
      - type: object
        required:
        - iun
        - sentAt
        properties:
          senderPaId:
            type: string
            description: Identificativo (non IPA) della PA mittente che ha eseguito l'onboarding su SelfCare.
            pattern: ^.*$
            maxLength: 256
          iun:
            $ref: '#/components/schemas/IUN'
          sentAt:
            type: string
            description: Momento di ricezione della notifica da parte di PN
            format: date-time
          cancelledByIun:
            $ref: '#/components/schemas/IUN'
          documentsAvailable:
            type: boolean
            description: Indica se i documenti notificati sono ancora disponibili.
    TaxId:
      description: C.F. persona fisica o persona giuridica
      type: string
      minLength: 11
      maxLength: 16
      pattern: ^([A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{3}[A-Z]{1})|([0-9]{11})$
    PublicRegistryValidationResponseDetails:
      allOf:
      - $ref: '#/components/schemas/PublicRegistryResponseDetails'
      - type: object
        properties:
          registry:
            type: string
            description: "Rappresenta il registro consultato per ottenere l'indirizzo. Può assumere i seguenti valori:\n  - ANPR\n  - REGISTRO_IMPRESE\n"
            maxLength: 128
    NotificationAttachmentDownloadMetadataResponse:
      title: Url e metadati per il download di un allegato di una notifica
      description: "I due campi più importanti sono __url__ e __retryAfter__. <br/>\n  - __url__ è presente se il file è pronto per essere scaricato ed indica l'url a cui fare GET.\n  - __retryAfter__ indica che il file è stato archiviato e bisognerà aspettare un numero di\n    secondi non inferiore a quanto indicato dal campo _retryAfter_. <br/>"
      type: object
      required:
      - filename
      - contentType
      - contentLength
      - sha256
      properties:
        filename:
          type: string
        contentType:
          type: string
          example: application/pdf
        contentLength:
          type: integer
          format: int32
          example: 54092
          description: dimensione, in byte, del contenuto.
        sha256:
          type: string
          description: SHA256 del contenuto del file.
        url:
          type: string
          description: URL preautorizzato a cui effettuare una richiesta GET per ottenere il  contenuto del documento. Presente solo se il documento è pronto per il download.
        retryAfter:
          type: integer
          format: int32
          description: Stima del numero di secondi da aspettare prima che il contenuto del  documento sia disponibile per il download.
    NotificationFeePolicy:
      type: string
      description: 'Politica di addebitamento dei costi di notifica. <br/> - _FLAT_RATE_: costo forfettario fisso. In questa modalità SEND non gestisce  il costo della notifica per il destinatario.<br/> - _DELIVERY_MODE_: costo calcolato in base all''effettivo percorso di notifica. <br/>'
      enum:
      - FLAT_RATE
      - DELIVERY_MODE
    NewNotificationRequestStatusResponseV26:
      allOf:
