    TimelineElementCategoryV20:
      type: string
      description: "stato di avanzamento del processo di notifica:`\n  * `SENDER_ACK_CREATION_REQUEST` - Invio della richiesta di creazione dell'atto opponibile a terzi di presa in carico per il mittente a safe storage\n  * `VALIDATE_NORMALIZE_ADDRESSES_REQUEST` - Invio della richiesta di validazione e normalizzazione indirizzi fisici presenti nella richiesta di notifica\n  * `NORMALIZED_ADDRESS` - Salvataggio indirizzi normalizzati\n  * `REQUEST_ACCEPTED` - Richiesta di notifica accettata a seguito dei controlli di validazione\n  * `REQUEST_REFUSED` - Richiesta di notifica rifiutata per fallimento di validazione\n  * `SEND_COURTESY_MESSAGE` - Invio di un messaggio di cortesia\n  * `GET_ADDRESS` - Disponibilità dell’indirizzo specifico (domicilio digitale di piattaforma, domicilio digitale speciale, domicilio digitale generale, indirizzo fisico sulla notifica o sui registri nazionali)\n  * `PUBLIC_REGISTRY_CALL` - Richiesta ai registri pubblici per ottenere domicilio digitale generale o per ottenere indirizzo fisico da ANPR, da registro della imprese, da anagrafe tributaria.\n  * `PUBLIC_REGISTRY_RESPONSE` - Ricevuta la risposta dei registri pubblici\n  * `SCHEDULE_ANALOG_WORKFLOW` - Pianificazione del workflow per invio cartaceo\n  * `SCHEDULE_DIGITAL_WORKFLOW` -Pianificazione del workflow per invio digitale (PEC) del secondo tentativo in caso di fallimento del primo.\n  * `PREPARE_DIGITAL_DOMICILE` - Preparazione per l’invio dell’avviso digitale.Va a valutare la timeline per capire quale sarà il prossimo indirizzo da usare.\n  * `SEND_DIGITAL_DOMICILE` - Invio digitale dell’avviso di notifica\n  * `SEND_DIGITAL_PROGRESS` - Tentativo di Invio PEC ad un determinato indirizzo.\n  * `SEND_DIGITAL_FEEDBACK` - Ottenuto esito ad un invio digitale\n  * `SCHEDULE_REFINEMENT` - Pianificato il perfezionamento per decorrenza termini\n  * `REFINEMENT` - Perfezionamento per decorrenza termini\n  * `DIGITAL_DELIVERY_CREATION_REQUEST` - Invio della richiesta di creazione dell'atto opponibile a terzi di chiusura del workflow digitale a safe storage\n  * `DIGITAL_SUCCESS_WORKFLOW` - Completato con successo il workflow di invio digitale\n  * `DIGITAL_FAILURE_WORKFLOW` - Completato con fallimento il workflow di invio digitale: tutti i tentativi di invio ai domicili digitali sono falliti.\n  * `ANALOG_SUCCESS_WORKFLOW` - Completato con successo il workflow di invio cartaceo\n  * `ANALOG_FAILURE_WORKFLOW` - Completato con fallimento il workflow di invio cartaceo NOTA: se per tutti i destinatari si conclude il workflow con fallimento verrà scatenato l’evento COMPLETELY_UNREACHABLE\n  * `PREPARE_SIMPLE_REGISTERED_LETTER` - Invio richiesta di prepare (preparazione ad invio) raccomandata semplice a paperChannel\n  * `SEND_SIMPLE_REGISTERED_LETTER` - Invio di raccomandata semplice\n  * `SEND_SIMPLE_REGISTERED_LETTER_PROGRESS` - Ricezione informazioni intermedia relative ad una notificazione cartacea semplice\n  * `NOTIFICATION_VIEWED_CREATION_REQUEST` - Invio della richiesta di creazione dell'atto opponibile a terzi di presa visione a safe storage\n  * `NOTIFICATION_VIEWED` - Visualizzazione della notifica (perfeziona la notifica se non già perfezionata per decorrenza termini o da altro destinatario)\n  * `PREPARE_ANALOG_DOMICILE` - Invio richiesta di prepare (preparazione ad invio) cartaceo a paperChannel\n  * `SEND_ANALOG_DOMICILE` - Invio cartaceo dell’avviso di notifica\n  * `SEND_ANALOG_PROGRESS` - Ricezione informazioni intermedia relative ad una notificazione cartacea\n  * `SEND_ANALOG_FEEDBACK` - Ricezione esito dell'invio cartaceo\n  * `COMPLETELY_UNREACHABLE_CREATION_REQUEST` - Invio della richiesta di creazione dell'atto (simile a opponibile a terzi) di completamento con fallimento del workflow di invio cartaceo\n  * `COMPLETELY_UNREACHABLE` - Tutti i destinatari risultano irraggiungibili\n  * `AAR_CREATION_REQUEST` - Invio della richiesta di creazione dell'AAR (Avviso di Avvenuta Ricezione) a safe storage\n  * `AAR_GENERATION` - Generazione dell’AAR (Avviso di Avvenuta Ricezione)\n  * `PAYMENT` - Ricezione da parte della Pubblica Amministrazione di un evento di chiusura di una o più posizioni debitorie di tipo PagoPA. La presenza di questo evento inibisce l'invio di eventuali comunicazioni analogiche future ma non perfeziona la notifica.\n  * `NOT_HANDLED` - [DEPRECATO] Per la sperimentazione l'invio analogico non è previsto, viene inserito tale elemento di timeline\n  * `PROBABLE_SCHEDULING_ANALOG_DATE` - Data probabile di inizio del flusso analogico\n  * `NOTIFICATION_CANCELLATION_REQUEST` - Richiesta di annullamento di una notifica\n  * `NOTIFICATION_CANCELLED` - Notifica annullata\n  * `PREPARE_ANALOG_DOMICILE_FAILURE` - Fallimento della richiesta di prepare (preparazione ad invio) cartaceo a paperChannel\n"
      enum:
      - SENDER_ACK_CREATION_REQUEST
      - VALIDATE_NORMALIZE_ADDRESSES_REQUEST
      - NORMALIZED_ADDRESS
      - REQUEST_ACCEPTED
      - SEND_COURTESY_MESSAGE
      - GET_ADDRESS
      - PUBLIC_REGISTRY_CALL
      - PUBLIC_REGISTRY_RESPONSE
      - SCHEDULE_ANALOG_WORKFLOW
      - SCHEDULE_DIGITAL_WORKFLOW
      - PREPARE_DIGITAL_DOMICILE
      - SEND_DIGITAL_DOMICILE
      - SEND_DIGITAL_PROGRESS
      - SEND_DIGITAL_FEEDBACK
      - REFINEMENT
      - SCHEDULE_REFINEMENT
      - DIGITAL_DELIVERY_CREATION_REQUEST
      - DIGITAL_SUCCESS_WORKFLOW
      - DIGITAL_FAILURE_WORKFLOW
      - ANALOG_SUCCESS_WORKFLOW
      - ANALOG_FAILURE_WORKFLOW
      - PREPARE_SIMPLE_REGISTERED_LETTER
      - SEND_SIMPLE_REGISTERED_LETTER
      - SEND_SIMPLE_REGISTERED_LETTER_PROGRESS
      - NOTIFICATION_VIEWED_CREATION_REQUEST
      - NOTIFICATION_VIEWED
      - PREPARE_ANALOG_DOMICILE
      - SEND_ANALOG_DOMICILE
      - SEND_ANALOG_PROGRESS
      - SEND_ANALOG_FEEDBACK
      - PAYMENT
      - COMPLETELY_UNREACHABLE
      - COMPLETELY_UNREACHABLE_CREATION_REQUEST
      - REQUEST_REFUSED
      - AAR_CREATION_REQUEST
      - AAR_GENERATION
      - NOT_HANDLED
      - PROBABLE_SCHEDULING_ANALOG_DATE
      - NOTIFICATION_CANCELLATION_REQUEST
      - NOTIFICATION_CANCELLED
      - PREPARE_ANALOG_DOMICILE_FAILURE
    Denomination:
      description: 'Denominazione ente o persona fisica / ragione sociale. La codifica prevede i caratteri ISO LATIN 1, senza | e senza i caratteri di controllo, ovvero la seguente regexp: ^[ -{}~\u00A0-ÿ]*$'
      type: string
      minLength: 1
      maxLength: 88
      pattern: ^.*$
    LegalFactCategoryV20:
      title: Tipi di atti opponibili a terzi
      description: "Tipi di atti opponibili a terzi che Piattaforma Notifiche mette a disposizione dei suoi utenti. <br/>\n  - SENDER_ACK  <br/>\n  - DIGITAL_DELIVERY  <br/>\n  - ANALOG_DELIVERY  <br/>\n  - RECIPIENT_ACCESS <br/>\n  - PEC_RECEIPT  <br/>\n  - ANALOG_FAILURE_DELIVERY  <br/>\n  - NOTIFICATION_CANCELLED  <br/>"
      type: string
    CompletelyUnreachableCreationRequestDetailsV28:
      type: object
      required:
      - recIndex
      properties:
        recIndex:
          type: integer
          description: Index destinatario notifica digitale
          format: int32
        legalFactId:
          type: string
          maxLength: 128
          description: Identificativo dell'atto opponibile a terzi del quale è stata richiesta la creazione
        endWorkflowStatus:
          $ref: '#/components/schemas/EndWorkflowStatus'
        completionWorkflowDate:
          type: string
          description: Data chiusura workflow
          format: date-time
    VatV23:
      type: integer
      description: IVA espressa in percentuale sui costi degli avvisi in formato cartaceo.<br/> Obbligatoria per notifiche con notificationFeePolicy=DELIVERY_MODE. <br/> Per le notifiche effettuate con versioni precedenti alla 2.3 si assume il valore di default 22. <br/> Esempio vat al 22% -> 22 <br/>
      format: int32
      minimum: 0
      maximum: 100
    NewNotificationRequestStatusResponseV24:
      allOf:
      - $ref: '#/components/schemas/NewNotificationRequestV24'
      - type: object
        required:
        - notificationRequestId
        - notificationRequestStatus
        properties:
          notificationRequestId:
            description: identificativo univoco di una richiesta di invio notifica, non è lo IUN
            type: string
          notificationRequestStatus:
            description: '- __WAITING__: in attesa di essere valutata - __ACCEPTED__: richiesta di notifica accettata, lo IUN è valorizzato - __REFUSED__: richiesta di notifica rifiutata, è valorizzato il campo _errors_'
            type: string
          retryAfter:
            type: integer
            format: int32
            description: Numero di secondi da attendere prima di effettuare una nuova richiesta per  la stessa entità; valorizzato quando lo status è __WAITING__.
          iun:
            $ref: '#/components/schemas/IUN'
          errors:
            description: Elenco degli errori che hanno causato il rifiuto della richiesta di notifica
            type: array
            items:
              $ref: '#/components/schemas/ProblemError'
    NotificationTimelineReworkedDetails:
      type: object
      required:
      - recIndex
      - sentAttemptMade
      - invalidatedTimelineAndStatusHistory
      properties:
        recIndex:
          type: integer
          description: Index destinatario notifica digitale
          format: int32
        sentAttemptMade:
          type: integer
          description: numero dei tentativi effettuati
          format: int32
        invalidatedTimelineAndStatusHistory:
          description: elenco degli avanzamenti effettuati dal processo di notifica prima dell'invalidazione
          type: array
          items:
            $ref: '#/components/schemas/NotificationStatusHistoryInvalidatedElement'
    TimelineElementV25:
      type: object
      additionalProperties: false
      properties:
        elementId:
          type: string
          maxLength: 512
          description: 'Identificativo dell''elemento di timeline: insieme allo IUN della notifica definisce in maniera univoca l''elemento di timeline'
        timestamp:
          type: string
          deprecated: true
          description: Istante in cui avviene l'evento descritto in questo elemento di timeline (deprecato, fare riferimento al campo eventTimestamp)
          format: date-time
        ingestionTimestamp:
          type: string
          description: Istante in cui l'evento descritto in questo elemento di timeline è gestito da SEND
          format: date-time
        eventTimestamp:
          type: string
          description: Istante in cui avviene l'evento descritto in questo elemento di timeline
          format: date-time
        notificationSentAt:
          type: string
          description: Momento di ricezione della richiesta di notifica da parte di SEND
          format: date-time
        legalFactsIds:
          type: array
          items:
            $ref: '#/components/schemas/LegalFactsIdV20'
          description: Chiavi dei documenti che provano l'effettivo accadimento dell'evento descritto in timeline. Questo elemento
        category:
          $ref: '#/components/schemas/TimelineElementCategoryV23'
        details:
          $ref: '#/components/schemas/TimelineElementDetailsV25'
    NotificationStatusHistoryElement:
      description: elenco degli avanzamenti effettuati dal processo di notifica
      type: object
      required:
      - status
      - activeFrom
      - relatedTimelineElements
      properties:
        status:
          $ref: '#/components/schemas/NotificationStatus'
        activeFrom:
          type: string
          description: data e ora di raggiungimento dello stato di avanzamento
          format: date-time
        relatedTimelineElements:
          type: array
          description: Eventi avvenuti nello stato
          items:
            $ref: '#/components/schemas/TimelineElementId'
    NotificationViewedCreationRequestDetails:
      type: object
      required:
