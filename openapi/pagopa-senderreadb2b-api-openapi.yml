    NewNotificationRequestV26:
      description: I campi utilizzati per la creazione di una nuova Notifica.
      type: object
      required:
      - paProtocolNumber
      - subject
      - recipients
      - documents
      - physicalCommunicationType
      - notificationFeePolicy
      - senderDenomination
      - senderTaxId
      - taxonomyCode
      properties:
        idempotenceToken:
          description: Identificativo utilizzabile dal chiamante per disambiguare differenti  "richieste di notificazione" effettuate con lo stesso numero di protocollo  (campo _paProtocolNumber_). Questo può essere necessario in caso di  "richiesta di notifica" rifiutata per errori nei codici di verifica degli allegati.
          type: string
          pattern: ^[ -~]*$
          maxLength: 256
        paProtocolNumber:
          description: Numero di protocollo che la PA mittente assegna alla notifica stessa
          type: string
          pattern: ^.*$
          maxLength: 256
        subject:
          type: string
          description: titolo della notifica, NON inserire dati personali/sensibili
          maxLength: 134
          pattern: ^.*$
        abstract:
          type: string
          description: descrizione sintetica della notifica, NON inserire dati personali/sensibili
          pattern: ^.*$
          maxLength: 1024
        recipients:
          type: array
          description: Informazioni sui destinatari
          items:
            $ref: '#/components/schemas/NotificationRecipientV24'
          minItems: 1
        documents:
          type: array
          description: Documenti notificati
          items:
            $ref: '#/components/schemas/NotificationDocument'
          minItems: 1
        notificationFeePolicy:
          $ref: '#/components/schemas/NotificationFeePolicy'
        cancelledIun:
          $ref: '#/components/schemas/IUN'
        physicalCommunicationType:
          type: string
          description: Tipologia comunicazione fisica
          enum:
          - AR_REGISTERED_LETTER
          - REGISTERED_LETTER_890
        senderDenomination:
          $ref: '#/components/schemas/Denomination'
        senderTaxId:
          description: Sender PA fiscal code
          example: '77777777777'
          type: string
          maxLength: 11
          minLength: 11
          pattern: ^\d+$
        group:
          type: string
          description: Gruppo di utenti dell'ente mittente che può visualizzare la notifica
          pattern: ^[ -~]*$
          maxLength: 1024
        amount:
          type: integer
          format: int32
          description: Importo della notifica in eurocent
        paymentExpirationDate:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^([0-9]{4})-(1[0-2]|0[1-9])-(3[01]|[12][0-9]|0[1-9])$
          description: Data di scadenza del pagamento nel formato YYYY-MM-DD riferito all'Italia
        taxonomyCode:
          type: string
          minLength: 7
          maxLength: 7
          pattern: ^([0-9]{6}[A-Z]{1})$
          description: Codice tassonomico della notifica basato sulla definizione presente nell'allegato 2 capitolo C del bando [__AVVISO PUBBLICO MISURA 1.4.5 PIATTAFORMA NOTIFICHE DIGITALI__](https://pnrrcomuni.fondazioneifel.it/bandi_public/Bando/325)
        paFee:
          $ref: '#/components/schemas/PaFeeV23'
        vat:
          $ref: '#/components/schemas/VatV23'
        pagoPaIntMode:
          type: string
          description: 'Modalitá di integrazione pagoPA per l''attualizazione del costo della notifica. <br/> - _NONE_: nessuna attualizzazione. <br/> - _SYNC_: modalitá sincrona. <br/> - _ASYNC_: modalitá asincrona. <br/>'
          enum:
          - NONE
          - SYNC
          - ASYNC
        additionalLanguages:
          description: 'In questo campo è possibile definire la lingua addizionale (oltre a quella italiana) da utilizzare per la generazione documenti, atti opponibili a terzi ecc.<br/> Le lingue accettate e dunque i valori possibili degli item dell''array sono: <br/> - DE <br/> - SI <br/> - FR <br/> DE (tedesco), SI (sloveno), FR (francese) Attualmente è possibile indicare un solo item e dunque una sola lingua aggiuntiva. Se non vengono indicate lingue aggiuntive la lingua utilizzata per generare <br/> documenti, atti opponibili a terzi ecc. sarà quella italiana.'
          type: array
          maxItems: 1
          items:
            type: string
        physicalCommunicationPriority:
          type: integer
          format: int32
          description: Priorità del primo tentativo di recapito quando è attiva la funzionalità di gestione dei picchi, dove 100 rappresenta la priorità massima e 0 la minima.  Regola l'ordine di affido delle spedizioni all'interno della sola quota mittente, dando precedenza a quelle più urgenti senza impattare sulle quote degli altri enti.
          minimum: 0
          maximum: 100
          default: 0
          example: 0
    IoSendMessageResult:
      type: string
      description: Risultato invio messaggio su IO
      enum:
      - NOT_SENT_OPTIN_ALREADY_SENT
      - SENT_COURTESY
      - SENT_OPTIN
  parameters:
    pathRecipientIdx:
      name: recipientIdx
      description: indice del destinatario nella lista partendo da 0.
      in: path
      required: true
      schema:
        type: integer
        format: int32
    notificationRequestId:
      in: query
      required: false
      name: notificationRequestId
      description: identificativo della richiesta di notifica
      schema:
        type: string
        maxLength: 36
        pattern: ^[A-Za-z0-9+/=]{36}$
    idempotenceToken:
      name: idempotenceToken
      description: token usato per disambiguare "richieste di notificazione" effettuate con lo stesso  numero di protocollo.
      in: query
      required: false
      schema:
        type: string
        pattern: ^[ -~]*$
        maxLength: 256
    pathIun:
      description: Identificativo Univoco Notifica
      name: iun
      in: path
      required: true
      schema:
        type: string
        minLength: 25
        maxLength: 25
        pattern: ^[A-Z]{4}-[A-Z]{4}-[A-Z]{4}-[0-9]{6}-[A-Z]{1}-[0-9]{1}$
    pathAttachmentName:
      name: attachmentName
      description: Tipologia del pagamento allegato alla notifica. Valori possibili PAGOPA|F24
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 6
        pattern: PAGOPA|F24
    pathDocumentIdx:
      name: docIdx
      description: indice del documento nella lista partendo da 0.
      in: path
      required: true
      schema:
        type: integer
        format: int32
    paProtocolNumber:
      name: paProtocolNumber
      in: query
      required: false
      description: Numero di protocollo associato alla notifica, può essere riutilizzato per rettifiche.
      schema:
        type: string
        pattern: ^.*$
        maxLength: 256
    attachmentIdx:
      in: query
      name: attachmentIdx
      description: indice del documento di pagamento partendo da 0
      required: false
      schema:
        type: integer
        format: int32
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
