    TimelineElementCategoryV27:
      type: string
      description: "stato di avanzamento del processo di notifica:`\n  * `SENDER_ACK_CREATION_REQUEST` - Invio della richiesta di creazione, firma e marca dell'atto opponibile a terzi di presa in carico per il mittente a safe storage\n  * `VALIDATE_NORMALIZE_ADDRESSES_REQUEST` - Invio della richiesta di validazione e normalizzazione indirizzi fisici presenti nella richiesta di notifica\n  * `NORMALIZED_ADDRESS` - Salvataggio indirizzi normalizzati\n  * `REQUEST_ACCEPTED` - Richiesta di notifica accettata a seguito dei controlli di validazione\n  * `REQUEST_REFUSED` - Richiesta di notifica rifiutata per fallimento di validazione\n  * `SEND_COURTESY_MESSAGE` - Invio di un messaggio di cortesia\n  * `GET_ADDRESS` - Disponibilità dell’indirizzo specifico (domicilio digitale di piattaforma, domicilio digitale speciale, domicilio digitale generale, indirizzo fisico sulla notifica o sui registri nazionali)\n  * `PUBLIC_REGISTRY_CALL` - Richiesta ai registri pubblici per ottenere domicilio digitale generale o per ottenere indirizzo fisico da ANPR, da registro della imprese, da anagrafe tributaria.\n  * `PUBLIC_REGISTRY_RESPONSE` - Ricevuta la risposta dei registri pubblici\n  * `SCHEDULE_ANALOG_WORKFLOW` - Pianificazione del workflow per invio cartaceo\n  * `SCHEDULE_DIGITAL_WORKFLOW` -Pianificazione del workflow per invio digitale (PEC) del secondo tentativo in caso di fallimento del primo.\n  * `PREPARE_DIGITAL_DOMICILE` - Preparazione per l’invio dell’avviso digitale.Va a valutare la timeline per capire quale sarà il prossimo indirizzo da usare.\n  * `SEND_DIGITAL_DOMICILE` - Invio digitale dell’avviso di notifica\n  * `SEND_DIGITAL_PROGRESS` - Tentativo di Invio PEC ad un determinato indirizzo.\n  * `SEND_DIGITAL_FEEDBACK` - Ottenuto esito ad un invio digitale\n  * `SCHEDULE_REFINEMENT` - Pianificato il perfezionamento per decorrenza termini\n  * `REFINEMENT` - Perfezionamento per decorrenza termini\n  * `DIGITAL_DELIVERY_CREATION_REQUEST` - Invio della richiesta di creazione, firma e marca dell'atto opponibile a terzi di chiusura del workflow digitale a safe storage\n  * `DIGITAL_SUCCESS_WORKFLOW` - Completato con successo il workflow di invio digitale\n  * `DIGITAL_FAILURE_WORKFLOW` - Completato con fallimento il workflow di invio digitale: tutti i tentativi di invio ai domicili digitali sono falliti.\n  * `ANALOG_SUCCESS_WORKFLOW` - Completato con successo il workflow di invio cartaceo\n  * `ANALOG_FAILURE_WORKFLOW` - Completato con fallimento il workflow di invio cartaceo NOTA: se per tutti i destinatari si conclude il workflow con fallimento verrà scatenato l’evento COMPLETELY_UNREACHABLE\n  * `PREPARE_SIMPLE_REGISTERED_LETTER` - Invio richiesta di prepare (preparazione ad invio) raccomandata semplice a paperChannel\n  * `SEND_SIMPLE_REGISTERED_LETTER` - Invio di raccomandata semplice\n  * `SEND_SIMPLE_REGISTERED_LETTER_PROGRESS` - Ricezione informazioni intermedia relative ad una notificazione cartacea semplice\n  * `NOTIFICATION_VIEWED_CREATION_REQUEST` - Invio della richiesta di creazione, firma e marca dell'atto opponibile a terzi di presa visione a safe storage\n  * `NOTIFICATION_VIEWED` - Visualizzazione della notifica (perfeziona la notifica se non già perfezionata per decorrenza termini o da altro destinatario)\n  * `PREPARE_ANALOG_DOMICILE` - Invio richiesta di prepare (preparazione ad invio) cartaceo a paperChannel\n  * `SEND_ANALOG_DOMICILE` - Invio cartaceo dell’avviso di notifica\n  * `SEND_ANALOG_PROGRESS` - Ricezione informazioni intermedia relative ad una notificazione cartacea\n  * `SEND_ANALOG_FEEDBACK` - Ricezione esito dell'invio cartaceo\n  * `COMPLETELY_UNREACHABLE_CREATION_REQUEST` - Invio della richiesta di creazione, firma e marca dell'atto (simile a opponibile a terzi) di completamento con fallimento del workflow di invio cartaceo\n  * `COMPLETELY_UNREACHABLE` - Tutti i destinatari risultano irraggiungibili\n  * `AAR_CREATION_REQUEST` - Invio della richiesta di creazione, firma e marca dell'AAR (Avviso di Avvenuta Ricezione) a safe storage\n  * `AAR_GENERATION` - Generazione dell’AAR (Avviso di Avvenuta Ricezione)\n  * `PAYMENT` - Evento di ricezione __dal mittente__ dell'informazione di chiusura di uno o più pagamenti di tipo pagoPA (vedi #/components/schemas/PagoPaPayment). La presenza di questo evento inibisce l'invio di eventuali comunicazioni analogiche future ma non perfeziona la notifica.\n  * `NOT_HANDLED` - [DEPRECATO] Per la sperimentazione l'invio analogico non è previsto, viene inserito tale elemento di timeline\n  * `PROBABLE_SCHEDULING_ANALOG_DATE` - Data probabile di inizio del flusso analogico\n  * `NOTIFICATION_CANCELLATION_REQUEST` - Richiesta di annullamento di una notifica\n  * `NOTIFICATION_CANCELLED` - Notifica annullata\n  * `PREPARE_ANALOG_DOMICILE_FAILURE` - Fallimento della richiesta di prepare (preparazione ad invio) cartaceo a paperChannel\n  * `NOTIFICATION_RADD_RETRIEVED` - Accesso alla notifica tramite la rete RADD. Non perfeziona la notifica.\n  * `ANALOG_WORKFLOW_RECIPIENT_DECEASED` - Destinatario deceduto\n  * `PUBLIC_REGISTRY_VALIDATION_CALL` - Ricerca dell'indirizzo di spedizione in fase di validazione notifica\n  * `PUBLIC_REGISTRY_VALIDATION_RESPONSE` - Recupero dell'indirizzo di spedizione dai registri nazionali\n"
      enum:
      - SENDER_ACK_CREATION_REQUEST
      - VALIDATE_NORMALIZE_ADDRESSES_REQUEST
      - NORMALIZED_ADDRESS
      - REQUEST_ACCEPTED
      - SEND_COURTESY_MESSAGE
      - GET_ADDRESS
      - PUBLIC_REGISTRY_CALL
      - PUBLIC_REGISTRY_RESPONSE
      - SCHEDULE_ANALOG_WORKFLOW
      - SCHEDULE_DIGITAL_WORKFLOW
      - PREPARE_DIGITAL_DOMICILE
      - SEND_DIGITAL_DOMICILE
      - SEND_DIGITAL_PROGRESS
      - SEND_DIGITAL_FEEDBACK
      - REFINEMENT
      - SCHEDULE_REFINEMENT
      - DIGITAL_DELIVERY_CREATION_REQUEST
      - DIGITAL_SUCCESS_WORKFLOW
      - DIGITAL_FAILURE_WORKFLOW
      - ANALOG_SUCCESS_WORKFLOW
      - ANALOG_FAILURE_WORKFLOW
      - PREPARE_SIMPLE_REGISTERED_LETTER
      - SEND_SIMPLE_REGISTERED_LETTER
      - SEND_SIMPLE_REGISTERED_LETTER_PROGRESS
      - NOTIFICATION_VIEWED_CREATION_REQUEST
      - NOTIFICATION_VIEWED
      - PREPARE_ANALOG_DOMICILE
      - SEND_ANALOG_DOMICILE
      - SEND_ANALOG_PROGRESS
      - SEND_ANALOG_FEEDBACK
      - PAYMENT
      - COMPLETELY_UNREACHABLE
      - COMPLETELY_UNREACHABLE_CREATION_REQUEST
      - REQUEST_REFUSED
      - AAR_CREATION_REQUEST
      - AAR_GENERATION
      - NOT_HANDLED
      - PROBABLE_SCHEDULING_ANALOG_DATE
      - NOTIFICATION_CANCELLATION_REQUEST
      - NOTIFICATION_CANCELLED
      - PREPARE_ANALOG_DOMICILE_FAILURE
      - NOTIFICATION_RADD_RETRIEVED
      - ANALOG_WORKFLOW_RECIPIENT_DECEASED
      - PUBLIC_REGISTRY_VALIDATION_CALL
      - PUBLIC_REGISTRY_VALIDATION_RESPONSE
