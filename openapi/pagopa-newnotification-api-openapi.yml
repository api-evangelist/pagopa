openapi: 3.2.0
info:
  title: Pagopa New Notification API
  version: 1.0.0
  contact:
    name: 'SEND: supporto enti'
    url: https://pagopa.atlassian.net/servicedesk/customer/portal/5
  termsOfService: https://selfcare.notifichedigitali.it/termini-di-servizio
  x-api-id: api-external-b2b-pa
  x-summary: 'Piattaforma Notifiche: API B2B per le Pubbliche Amministrazioni'
  description: 'Operations tagged NewNotification across 2 of this provider''s published API definitions: send-b2b-pa-bundle.yaml, pagopa-send-b2b-pa-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.notifichedigitali.it
  description: Ambiente di produzione
- url: https://api.uat.notifichedigitali.it
  description: Ambiente di collaudo
security:
- ApiKeyAuth: []
tags:
- name: NewNotification
  description: Invocazioni per effettuare il pre-caricamento dei documenti della notifica e inviare notifiche
paths:
  /delivery/attachments/preload:
    post:
      summary: Richiesta di pre-caricamento dei documenti della notifica
      description: Operazione che richiede a Piattaforma Notifica le informazioni e le autorizzazioni necessarie a precaricare uno o più file da allegare a una notifica.
      tags:
      - NewNotification
      operationId: presignedUploadRequest
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PreLoadRequest'
              minItems: 1
              maxItems: 15
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreLoadResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    servers:
    - url: https://api.notifichedigitali.it
      description: Ambiente di produzione
    - url: https://api.uat.notifichedigitali.it
      description: Ambiente di collaudo
  /delivery/v2.6/requests:
    post:
      summary: Richiesta invio notifica
      description: 'Operazione utilizzata dalla Pubblica Amministrazione per richiedere l''invio di una notifica.


        La restituzione di uno stato HTTP 202 significa solo che la richiesta è sintatticamente

        valida, non che la richiesta sia stata validata ed accettata.


        Per conoscere lo stato di accettazione della richiesta di notifica bisogna utilizzare l''operazione

        _getNotificationRequestStatus_ oppure utilizzare la modalità push prevista dai webhook.'
      tags:
      - NewNotification
      operationId: sendNewNotificationV26
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewNotificationRequestV26'
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewNotificationResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    servers:
    - url: https://api.notifichedigitali.it
      description: Ambiente di produzione
    - url: https://api.uat.notifichedigitali.it
      description: Ambiente di collaudo
  /delivery/requests:
    post:
      deprecated: true
      summary: Richiesta invio notifica
      description: 'Operazione utilizzata dalla Pubblica Amministrazione per richiedere l''invio di una notifica.


        La restituzione di uno stato HTTP 202 significa solo che la richiesta è sintatticamente

