openapi: 3.2.0
info:
  version: 4.1.1
  title: IO API for Public Administration Services Service Topics API
  contact:
    name: PagoPA S.p.A.
    url: https://docs.pagopa.it/io-guida-tecnica/
  x-logo:
    url: https://io.italia.it/assets/img/io-logo-blue.svg
  description: '# Warning

    **This is an experimental API that is (most probably) going to change as we evolve the IO platform.**

    # Introduction

    This is the documentation of the IO API for 3rd party services.'
servers:
- url: https://api.io.pagopa.it/api/v1
tags:
- name: service-topics
paths:
  /manage/services/topics:
    get:
      tags:
      - service-topics
      summary: Retrieve all service topics
      operationId: getServiceTopics
      security:
      - SubscriptionKey: []
      responses:
        '200':
          description: Service topics fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmsServiceTopicList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Too many requests
        '500':
          description: Internal server error
components:
  schemas:
    CmsServiceTopicList:
      type: object
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/CmsServiceTopic'
    CmsServiceTopic:
      type: object
      properties:
        id:
          type: number
          description: The topic id
          example: 3
        name:
          type: string
          description: The topic name
          example: Benessere sociale
      required:
      - id
      - name
  securitySchemes:
    SubscriptionKey:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: The API key obtained through the Backoffice IO or both getService or cmsGetServiceKeys operation.
    ManageSubscriptionKey:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: The `manage` API key obtained through the Backoffice IO.
