components:
  schemas:
    AgreementApprovalPolicy:
      type: string
      description: E-Service Descriptor policy for new Agreements approval
      enum:
      - AUTOMATIC
      - MANUAL
    EServiceTemplateVersions:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/EServiceTemplateVersion'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    EServiceTemplateVersionAttributesGroupSeed:
      type: object
      additionalProperties: false
      properties:
        attributeIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - attributeIds
    Document:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - prettyName
      - contentType
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the file
        name:
          type: string
          description: The name of the file
        prettyName:
          type: string
          description: A human-readable name for the file
        contentType:
          type: string
          description: The content type of the file
        createdAt:
          type: string
          format: date-time
          description: The date and time when the file was uploaded
    DeclaredAttribute:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - createdAt
    FileUploadMultipart:
      type: object
      additionalProperties: false
      required:
      - file
      - prettyName
      properties:
        file:
          type: string
          format: binary
          description: The file to upload
        prettyName:
          type: string
          description: A human-readable name for the file
    EServiceTemplateVersionVerifiedAttribute:
      type: object
      description: Represents an E-Service Template Version Verified attribute with the index of its attribute group.
      properties:
        groupIndex:
          type: integer
          format: int32
          minimum: 0
          description: The index of the group to which the attribute belongs.
        attribute:
          $ref: '#/components/schemas/VerifiedAttribute'
      required:
      - groupIndex
      - attribute
    VersionSeedForEServiceTemplateCreation:
      required:
      - voucherLifespan
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 10
          maxLength: 250
        voucherLifespan:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
        dailyCallsPerConsumer:
          description: Maximum number of daily calls that this descriptor can afford
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000000
        dailyCallsTotal:
          description: Total daily calls available for this e-service
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000000
        agreementApprovalPolicy:
          $ref: '#/components/schemas/AgreementApprovalPolicy'
    Pagination:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          format: int32
          minimum: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        totalCount:
          type: integer
          format: int32
          minimum: 0
      required:
      - offset
      - limit
      - totalCount
    FileDownloadMultipart:
      type: object
      additionalProperties: false
      required:
      - file
      - filename
      - contentType
      - id
      properties:
        file:
          type: string
          format: binary
          description: The file to download
        filename:
          type: string
          description: The name of the file
        contentType:
          type: string
          description: The content type of the file
        id:
          type: string
          format: uuid
          description: Unique identifier of the file
        prettyName:
          type: string
          description: A human-readable name for the file
    VerifiedAttribute:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - createdAt
    EServiceTemplateVersionState:
      type: string
      description: E-Service Template Version State
      enum:
      - DRAFT
      - PUBLISHED
      - DEPRECATED
      - SUSPENDED
    RiskAnalysisForm:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
          minLength: 1
          maxLength: 250
        answers:
          description: 'Key-value pairs of risk analysis form answers.

            Key: question ID; value: array of answers

            '
          additionalProperties:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 2000
      required:
      - version
      - answers
    EServiceTemplateVersionDraftUpdateSeed:
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 10
          maxLength: 250
        voucherLifespan:
