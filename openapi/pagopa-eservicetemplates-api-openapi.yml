        dailyCallsPerConsumer:
          description: Maximum number of daily calls that this descriptor can afford per consumer
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000000
        dailyCallsTotal:
          description: Total daily calls available for this E-Service
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000000
    EServiceTemplate:
