  - x-api-id differs across the merged source definitions and was not carried
  - x-summary differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged events across 2 of this provider''s published API definitions: interop-api-v3.yaml, pagopa-send-b2b-pa-openapi.yml. Each path carries the servers of the definition it was published in.'
