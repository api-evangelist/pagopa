        '429':
          $ref: '#/components/responses/TooManyRequests'
  /tenants/{tenantId}/verifiedAttributes:
    parameters:
    - name: tenantId
      in: path
      description: The Tenant ID of the Verified Attributes
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
    get:
      tags:
      - Tenants
      summary: List Tenant Verified Attributes
      description: Retrieve a list of Verified Attributes assigned to the Tenant
      operationId: getTenantVerifiedAttributes
      parameters:
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Tenant Verified Attributes retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantVerifiedAttributes'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Tenants
      summary: Assign a Verified Attribute to a Tenant with yourself as verifier.
      description: Assign a Verified Attribute to a Tenant
      operationId: assignTenantVerifiedAttribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantVerifiedAttributeSeed'
      responses:
        '200':
          description: Verified Attribute assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantVerifiedAttribute'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /tenants/{tenantId}/verifiedAttributes/{attributeId}:
    parameters:
    - name: tenantId
      in: path
      description: The Tenant ID of the Verified Attribute
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
    - name: attributeId
      in: path
      description: The Verified Attribute ID
      required: true
      schema:
        $ref: '#/components/schemas/AttributeId'
    delete:
      tags:
      - Tenants
      summary: Revoke a Verified Attribute from a Tenant
      description: 'Revoke a Verified Attribute from a Tenant.

        You will be added to the list of revokers of the tenant Verified Attribute.'
      operationId: revokeTenantVerifiedAttribute
      parameters:
      - in: query
        required: true
        name: agreementId
        description: The ID of the Agreement
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Verified Attribute revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantVerifiedAttribute'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /tenants/{tenantId}/verifiedAttributes/{attributeId}/verifiers:
    parameters:
    - name: tenantId
      in: path
      description: The Tenant ID
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
    - name: attributeId
      in: path
      description: The Verified Attribute ID
      required: true
      schema:
        $ref: '#/components/schemas/AttributeId'
    get:
      tags:
      - Tenants
      summary: List Tenant Verified Attribute Verifiers
      description: Retrieve a list of Verifiers for a specific Verified Attribute of a Tenant
      operationId: getTenantVerifiedAttributeVerifiers
      parameters:
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Verified Attribute Verifiers retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantVerifiedAttributeVerifiers'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /tenants/{tenantId}/verifiedAttributes/{attributeId}/revokers:
    parameters:
    - name: tenantId
      in: path
      description: The Tenant ID
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
    - name: attributeId
      in: path
      description: The Verified Attribute ID
      required: true
      schema:
        $ref: '#/components/schemas/AttributeId'
    get:
      tags:
      - Tenants
      summary: List Tenant Verified Attribute Revokers
      description: Retrieve a list of Revokers for a specific Verified Attribute of a Tenant
      operationId: getTenantVerifiedAttributeRevokers
      parameters:
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Verified Attribute Revokers retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantVerifiedAttributeRevokers'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  schemas:
    AgreementId:
      type: string
      format: uuid
      description: The unique identifier of the Agreement
    Pagination:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          format: int32
          minimum: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        totalCount:
          type: integer
          format: int32
          minimum: 0
      required:
      - offset
      - limit
      - totalCount
    TenantVerifiedAttributeRevoker:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        verifiedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        extendedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        delegationId:
          $ref: '#/components/schemas/DelegationId'
      required:
      - id
      - verifiedAt
      - revokedAt
    TenantVerifiedAttributeVerifiers:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TenantVerifiedAttributeVerifier'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    TenantSubUnitType:
      type: string
      enum:
      - AOO
      - UO
    TenantKind:
      type: string
      enum:
      - PA
      - PRIVATE
      - GSP
      - SCP
    TenantDeclaredAttributeSeed:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        delegationId:
          $ref: '#/components/schemas/DelegationId'
      required:
      - id
    Tenant:
      description: Tenant model
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        externalId:
          $ref: '#/components/schemas/ExternalId'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        name:
          type: string
        kind:
          $ref: '#/components/schemas/TenantKind'
        onboardedAt:
          type: string
          format: date-time
        subUnitType:
          $ref: '#/components/schemas/TenantSubUnitType'
        selfcareInstitutionType:
          type: string
      required:
      - id
      - certifier
      - externalId
      - attributes
      - createdAt
      - mails
      - name
    ExternalId:
      properties:
        origin:
          type: string
          minLength: 3
          maxLength: 64
        value:
          type: string
      required:
      - origin
      - value
    TenantVerifiedAttribute:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
      required:
      - id
      - assignedAt
    TenantCertifiedAttributeSeed:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    DelegationId:
      type: string
      format: uuid
      description: The unique identifier of the Delegation
    TenantCertifiedAttribute:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
      required:
      - id
      - assignedAt
    TenantVerifiedAttributeSeed:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        agreementId:
          $ref: '#/components/schemas/AgreementId'
        expirationDate:
          type: string
          format: date-time
      required:
      - id
      - agreementId
    TenantCertifiedAttributes:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TenantCertifiedAttribute'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    TenantVerifiedAttributeRevokers:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TenantVerifiedAttributeRevoker'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    Problem:
      properties:
        type:
          description: URI reference of type definition
          type: string
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem
          example: 503
          format: int32
          minimum: 100
          type: integer
          exclusiveMaximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          maxLength: 64
          pattern: ^[ -~]{0,64}$
          type: string
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          maxLength: 64
          type: string
        detail:
          description: A human readable explanation of the problem
          example: Request took too long to complete
          maxLength: 4096
          pattern: ^.{0,1024}$
          type: string
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProblemError'
      additionalProperties: false
      required:
      - type
      - status
      - title
    TenantId:
      type: string
      format: uuid
      description: The unique identifier of the Tenant
    Tenants:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    TenantVerifiedAttributes:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TenantVerifiedAttribute'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    TenantDeclaredAttributes:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/TenantDeclaredAttribute'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    ProblemError:
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          minLength: 8
          maxLength: 8
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
        detail:
          description: A human readable explanation specific to this occurrence of the problem
          example: Parameter not valid
          maxLength: 4096
          pattern: ^.{0,1024}$
          type: string
      required:
      - code
      - detail
    TenantVerifiedAttributeVerifier:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        verifiedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        extendedAt:
          type: string
          format: date-time
        delegationId:
          $ref: '#/components/schemas/DelegationId'
      required:
      - id
      - verifiedAt
    AttributeId:
      type: string
      format: uuid
      description: The unique identifier of the Attribute
    TenantDeclaredAttribute:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        delegationId:
          $ref: '#/components/schemas/DelegationId'
      required:
      - id
      - assignedAt
  headers:
    RateLimitLimitHeader:
      schema:
        type: integer
        format: int32
        minimum: 0
      description: Max allowed requests within time interval
    RateLimitIntervalHeader:
      schema:
        type: integer
        format: int32
        minimum: 0
      description: Time interval in milliseconds. Allowed requests will be constantly replenished during the interval. At the end of the interval the max allowed requests will be available
    IntegrityRest02DigestHeader:
      schema:
        type: string
        pattern: ^SHA-256=[a-zA-Z0-9+/]{43}=$
      description: 'Digest of the body using the canonical JSON representation of the response body.

        The digest is calculated using the SHA-256 algorithm on the response body

        exactly as it is sent to the client, encoded in Base64 as per RFC 3230

        '
    IntegrityRest02AgidJwtSignatureHeader:
      description: 'The `Agid-JWT-Signature` header contains a JSON Web Signature (JWS) signed with the PDND API private key.

        It ensures payload integrity and non-repudiation across all responses (both success and error), in compliance with: 1) Linee Guida sull''interoperabilità tecnica delle Pubbliche Amministrazioni - Pattern di sicurezza,  2) RFC 7515 and 3) RFC 7519.

        '
      schema:
        type: string
    RateLimitRemainingHeader:
      schema:
        type: integer
        format: int32
        minimum: 0
      description: Remaining requests within time interval
  responses:
    NotFound:
