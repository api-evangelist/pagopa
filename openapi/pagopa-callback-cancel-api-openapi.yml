openapi: 3.2.0
info:
  title: Pagopa Callback Cancel API
  version: 0.0.1
  contact:
    email: cstar@pagopa.it
  description: 'Operations tagged callback-cancel across 2 of this provider''s published API definitions: srtp-callback.yaml, pagopa-srtp-callback-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Development/Test
  url: https://api-rtp-cb.dev.cstar.pagopa.it/rtp/cb/v1
  x-internal: true
- description: User Acceptance Test
  url: https://api-rtp-cb.uat.cstar.pagopa.it/rtp/cb/v1
  x-internal: false
- description: Production
  url: https://api-rtp-cb.cstar.pagopa.it/rtp/cb/v1
  x-internal: false
tags:
- name: callback-cancel
paths:
  /cancel:
    post:
      summary: Posting of a SEPA Request-To-Pay Cancellation Response to the Payee's SRTP…
      description: This endpoint is called by the payer's SRTP-SP to forward a SEPA payment cancellation request response to the payee's SRTP-SP via the callback URL provided during the initial request.
      operationId: sendCallbackCancel
      tags:
      - callback-cancel
      requestBody:
        description: ISO20022 based SEPA Request-To-Pay Cancellation Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SepaRequestToPayCancellationResponseResource'
        required: true
      responses:
        '200':
          description: OK - the callback server accepts the callback.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - description: Development/Test
      url: https://api-rtp-cb.dev.cstar.pagopa.it/rtp/cb/v1
      x-internal: true
    - description: User Acceptance Test
      url: https://api-rtp-cb.uat.cstar.pagopa.it/rtp/cb/v1
      x-internal: false
    - description: Production
      url: https://api-rtp-cb.cstar.pagopa.it/rtp/cb/v1
      x-internal: false
