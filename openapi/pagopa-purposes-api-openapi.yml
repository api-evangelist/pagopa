      - id
      - eserviceId
      - descriptorId
      - producerId
      - consumerId
      - state
      - createdAt
    Pagination:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          format: int32
          minimum: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        totalCount:
          type: integer
          format: int32
          minimum: 0
      required:
      - offset
      - limit
      - totalCount
    FileDownloadMultipart:
      type: object
      additionalProperties: false
      required:
      - file
      - filename
      - contentType
      - id
      properties:
        file:
