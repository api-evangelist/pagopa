components:
  schemas:
    PurposeDraftUpdateSeed:
      type: object
      additionalProperties: false
      description: Contains the expected payload for purpose update of a purpose not created from a purpose template
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 60
        description:
          type: string
          minLength: 10
          maxLength: 250
        isFreeOfCharge:
          type: boolean
        freeOfChargeReason:
          type:
          - string
          - 'null'
        riskAnalysisForm:
          $ref: '#/components/schemas/RiskAnalysisFormSeed'
        dailyCalls:
          description: Maximum number of daily calls that this version can perform.
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000000
    PurposeVersions:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PurposeVersion'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    PurposeDraftFromTemplateUpdateSeed:
      type: object
      additionalProperties: false
      description: Contains the expected payload for purpose update of a purpose created from a purpose template
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 60
        riskAnalysisForm:
          $ref: '#/components/schemas/RiskAnalysisFormSeed'
        dailyCalls:
          description: Maximum number of daily calls that this version can perform.
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000000
    Agreement:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        eserviceId:
          $ref: '#/components/schemas/EServiceId'
        descriptorId:
          $ref: '#/components/schemas/DescriptorId'
        producerId:
          type: string
          format: uuid
        consumerId:
          type: string
          format: uuid
        delegationId:
          $ref: '#/components/schemas/DelegationId'
        state:
          $ref: '#/components/schemas/AgreementState'
        suspendedByConsumer:
          type: boolean
        suspendedByProducer:
          type: boolean
        suspendedByPlatform:
          type: boolean
        consumerNotes:
          type: string
        rejectionReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        suspendedAt:
          type: string
          format: date-time
