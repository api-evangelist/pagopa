          $ref: '#/components/schemas/PurposeTemplateId'
      required:
      - id
      - eserviceId
      - consumerId
      - title
      - description
      - createdAt
      - isFreeOfCharge
    RiskAnalysisFormSeed:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 250
        answers:
          description: 'Key-value pairs of risk analysis form answers.

            Key: question ID; value: array of answers.

            '
          additionalProperties:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 2000
      required:
      - version
      - answers
    AgreementState:
      type: string
      description: Agreement State
      enum:
      - DRAFT
      - ACTIVE
      - ARCHIVED
      - PENDING
      - SUSPENDED
      - MISSING_CERTIFIED_ATTRIBUTES
      - REJECTED
    PurposeId:
      type: string
      format: uuid
      description: The unique identifier of the Purpose
    ProblemError:
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          minLength: 8
          maxLength: 8
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
        detail:
          description: A human readable explanation specific to this occurrence of the problem
          example: Parameter not valid
          maxLength: 4096
          pattern: ^.{0,1024}$
          type: string
      required:
      - code
      - detail
    PurposeFromTemplateSeed:
