          format: int32
          minimum: 1
          maximum: 1000000000
        rejectionReason:
          type: string
      required:
      - id
      - state
      - dailyCalls
      - createdAt
      description: business representation of a purpose version
    Purpose:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        eserviceId:
          $ref: '#/components/schemas/EServiceId'
        consumerId:
          type: string
          format: uuid
        suspendedByConsumer:
          type: boolean
        suspendedByProducer:
          type: boolean
        title:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isFreeOfCharge:
