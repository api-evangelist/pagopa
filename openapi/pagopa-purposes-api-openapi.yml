          format: uuid
        riskAnalysisId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 5
          maxLength: 60
        description:
          type: string
          minLength: 10
          maxLength: 250
        isFreeOfCharge:
          type: boolean
        freeOfChargeReason:
          type: string
        dailyCalls:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000000
