      additionalProperties: false
      description: contains the expected payload for purpose creation
      properties:
        eserviceId:
          $ref: '#/components/schemas/EServiceId'
        delegationId:
          description: 'Set it to create the Purpose for a Tenant for which you are the e-service consumer delegate.

            If not set, the Purpose will be created for your Tenant.

            '
