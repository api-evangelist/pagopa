components:
  schemas:
    EServiceSeed:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - technology
      - mode
      - descriptor
      properties:
        name:
          type: string
          minLength: 5
          maxLength: 60
        description:
          type: string
          minLength: 10
          maxLength: 400
        technology:
          $ref: '#/components/schemas/EServiceTechnology'
        mode:
          $ref: '#/components/schemas/EServiceMode'
        descriptor:
          $ref: '#/components/schemas/DescriptorSeedForEServiceCreation'
        isSignalHubEnabled:
          type: boolean
        isConsumerDelegable:
          type: boolean
        isClientAccessDelegable:
          type: boolean
        personalData:
          type: boolean
    AgreementApprovalPolicy:
      type: string
      description: E-Service Descriptor policy for new Agreements approval
      enum:
      - AUTOMATIC
      - MANUAL
    EServiceNameUpdateSeed:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 5
          maxLength: 60
    DescriptorSeedForEServiceCreation:
      required:
      - audience
      - voucherLifespan
      - dailyCallsPerConsumer
      - dailyCallsTotal
      - agreementApprovalPolicy
      type: object
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 10
          maxLength: 250
        audience:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            minLength: 0
            maxLength: 250
        voucherLifespan:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
        dailyCallsPerConsumer:
          description: Maximum number of daily calls that this descriptor can afford
          type: integer
          format: int32
          minimum: 1
        dailyCallsTotal:
          description: Total daily calls available for this e-service
          type: integer
          format: int32
          minimum: 1
        agreementApprovalPolicy:
          $ref: '#/components/schemas/AgreementApprovalPolicy'
    EServiceDescriptionUpdateSeed:
      type: object
      additionalProperties: false
      required:
      - description
      properties:
        description:
          type: string
          minLength: 10
          maxLength: 400
    Document:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - prettyName
      - contentType
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the file
        name:
          type: string
          description: The name of the file
        prettyName:
          type: string
          description: A human-readable name for the file
        contentType:
          type: string
          description: The content type of the file
        createdAt:
          type: string
          format: date-time
          description: The date and time when the file was uploaded
    DeclaredAttribute:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - createdAt
    FileUploadMultipart:
      type: object
      additionalProperties: false
      required:
      - file
      - prettyName
      properties:
        file:
          type: string
          format: binary
          description: The file to upload
        prettyName:
          type: string
          description: A human-readable name for the file
    Pagination:
      type: object
      additionalProperties: false
