components:
  schemas:
    PurposeTemplateId:
      type: string
      format: uuid
      description: The unique identifier of the Purpose Template
    PurposeTemplates:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PurposeTemplate'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    RiskAnalysisFormTemplate:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 250
        answers:
          description: 'Key-value pairs of risk analysis form template answers.

            Key: question ID; value: template of the answer

            '
          additionalProperties:
            $ref: '#/components/schemas/RiskAnalysisTemplateAnswer'
      required:
      - version
      - answers
    Problem:
      properties:
        type:
          description: URI reference of type definition
          type: string
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem
          example: 503
          format: int32
          minimum: 100
          type: integer
          exclusiveMaximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          maxLength: 64
          pattern: ^[ -~]{0,64}$
          type: string
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          maxLength: 64
          type: string
        detail:
          description: A human readable explanation of the problem
          example: Request took too long to complete
          maxLength: 4096
          pattern: ^.{0,1024}$
          type: string
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProblemError'
      additionalProperties: false
      required:
      - type
      - status
      - title
    ProblemError:
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          minLength: 8
          maxLength: 8
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
        detail:
          description: A human readable explanation specific to this occurrence of the problem
          example: Parameter not valid
          maxLength: 4096
          pattern: ^.{0,1024}$
          type: string
      required:
      - code
      - detail
    Pagination:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          format: int32
          minimum: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        totalCount:
          type: integer
          format: int32
          minimum: 0
      required:
      - offset
      - limit
      - totalCount
    RiskAnalysisTemplateAnnotationDocument:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: '#/components/schemas/Document'
        answerId:
          type: string
          format: uuid
      required:
      - document
      - answerId
    RiskAnalysisFormTemplateSeed:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 250
        answers:
          description: 'Key-value pairs of risk analysis form template answers.

            Key: question ID; value: template of the answer

            '
          additionalProperties:
            $ref: '#/components/schemas/RiskAnalysisTemplateAnswerSeed'
      required:
      - version
      - answers
    EServiceTechnology:
      type: string
      description: API Technology
      enum:
      - REST
      - SOAP
    TargetTenantKind:
      type: string
      description: The Target Tenant Kind of a Purpose Template
      enum:
      - PA
      - PRIVATE
    EServices:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/EService'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    PurposeTemplateState:
      type: string
      description: Purpose Template State
      enum:
      - PUBLISHED
      - DRAFT
      - SUSPENDED
      - ARCHIVED
    RiskAnalysisTemplateAnnotationDocuments:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RiskAnalysisTemplateAnnotationDocument'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    Document:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - prettyName
      - contentType
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the file
        name:
          type: string
          description: The name of the file
        prettyName:
          type: string
          description: A human-readable name for the file
        contentType:
          type: string
          description: The content type of the file
        createdAt:
          type: string
          format: date-time
          description: The date and time when the file was uploaded
    VoidObject:
      type: object
      additionalProperties: false
      description: An empty object
    PurposeTemplateSeed:
      type: object
      additionalProperties: false
      description: contains the expected payload for purpose template creation
      properties:
        targetDescription:
          type: string
          minLength: 10
          maxLength: 250
        targetTenantKind:
          $ref: '#/components/schemas/TargetTenantKind'
        purposeTitle:
          type: string
          minLength: 5
          maxLength: 60
        purposeDescription:
          type: string
          minLength: 10
          maxLength: 250
        purposeIsFreeOfCharge:
          type: boolean
        purposeFreeOfChargeReason:
          type: string
        purposeDailyCalls:
          description: Maximum number of daily calls that the purpose can perform
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000000
        handlesPersonalData:
          type: boolean
      required:
      - targetDescription
      - targetTenantKind
      - purposeTitle
      - purposeDescription
      - purposeIsFreeOfCharge
      - handlesPersonalData
    TemplateId:
      type: string
      format: uuid
      description: The unique identifier of the Template
    EServiceMode:
      type: string
      description: Indicates if the E-Service is intended for receiving or delivering data
      enum:
      - RECEIVE
      - DELIVER
    EServiceId:
      type: string
      format: uuid
      description: The unique identifier of the E-Service
    RiskAnalysisTemplateAnswerSeed:
      type: object
      additionalProperties: false
      properties:
        values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 2000
        editable:
          type: boolean
        annotationText:
          type: string
          minLength: 1
          maxLength: 2000
        suggestedValues:
          type: array
          items:
