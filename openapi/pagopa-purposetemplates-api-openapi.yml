        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /purposeTemplates/{purposeTemplateId}/eservices/{eserviceId}:
    parameters:
    - name: purposeTemplateId
      in: path
      description: The Purpose Template ID
      required: true
      schema:
        $ref: '#/components/schemas/PurposeTemplateId'
    - name: eserviceId
      in: path
      description: The Eservice ID to unlink
      required: true
      schema:
        $ref: '#/components/schemas/EServiceId'
