        id:
          type: string
          format: uuid
          description: Unique identifier of the file
        prettyName:
          type: string
          description: A human-readable name for the file
    RiskAnalysisTemplateAnswer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 2000
        editable:
          type: boolean
        annotationText:
          type: string
          minLength: 1
          maxLength: 2000
        suggestedValues:
