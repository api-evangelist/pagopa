        state:
          $ref: '#/components/schemas/PurposeTemplateState'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        purposeTitle:
          type: string
        purposeDescription:
          type: string
        purposeIsFreeOfCharge:
          type: boolean
        purposeFreeOfChargeReason:
          type: string
        purposeDailyCalls:
          description: Maximum number of daily calls that the purpose can perform
          type: integer
          format: int32
