components:
  schemas:
    ProducerDelegation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        delegatorId:
          $ref: '#/components/schemas/DelegatorId'
        delegateId:
          $ref: '#/components/schemas/DelegateId'
        eserviceId:
          $ref: '#/components/schemas/EServiceId'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
        revokedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
        rejectedAt:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/DelegationState'
      required:
      - id
      - delegatorId
      - delegateId
      - eserviceId
      - createdAt
      - state
      - submittedAt
    ConsumerDelegations:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerDelegation'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    ConsumerDelegation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        delegatorId:
          $ref: '#/components/schemas/DelegatorId'
        delegateId:
          $ref: '#/components/schemas/DelegateId'
        eserviceId:
          $ref: '#/components/schemas/EServiceId'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
        revokedAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
        rejectedAt:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/DelegationState'
      required:
      - id
      - delegatorId
      - delegateId
      - eserviceId
      - createdAt
      - state
      - submittedAt
    Problem:
      properties:
        type:
          description: URI reference of type definition
          type: string
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem
          example: 503
          format: int32
          minimum: 100
          type: integer
          exclusiveMaximum: 600
        title:
          description: A short, summary of the problem type. Written in english and readable
          example: Service Unavailable
          maxLength: 64
          pattern: ^[ -~]{0,64}$
          type: string
        correlationId:
          description: Unique identifier of the request
          example: 53af4f2d-0c87-41ef-a645-b726a821852b
          maxLength: 64
          type: string
        detail:
          description: A human readable explanation of the problem
          example: Request took too long to complete
          maxLength: 4096
          pattern: ^.{0,1024}$
          type: string
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProblemError'
      additionalProperties: false
      required:
      - type
      - status
      - title
    ProblemError:
      properties:
        code:
          description: Internal code of the error
          example: 123-4567
          minLength: 8
          maxLength: 8
          pattern: ^[0-9]{3}-[0-9]{4}$
          type: string
        detail:
          description: A human readable explanation specific to this occurrence of the problem
          example: Parameter not valid
          maxLength: 4096
          pattern: ^.{0,1024}$
          type: string
      required:
      - code
      - detail
    DelegateId:
      type: string
      format: uuid
      description: The unique identifier of the Delegate
    ProducerDelegations:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProducerDelegation'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
    DelegationState:
      type: string
      enum:
      - WAITING_FOR_APPROVAL
      - ACTIVE
      - REJECTED
      - REVOKED
    DelegationRejection:
      type: object
      additionalProperties: false
      properties:
        rejectionReason:
          type: string
      required:
      - rejectionReason
    DelegatorId:
      type: string
      format: uuid
      description: The unique identifier of the Delegator
    EServiceId:
      type: string
      format: uuid
      description: The unique identifier of the E-Service
    DelegationId:
      type: string
      format: uuid
      description: The unique identifier of the Delegation
    Pagination:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          format: int32
          minimum: 0
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        totalCount:
          type: integer
          format: int32
          minimum: 0
      required:
      - offset
      - limit
      - totalCount
    DelegationSeed:
      type: object
      additionalProperties: false
      properties:
        eserviceId:
          $ref: '#/components/schemas/EServiceId'
        delegateId:
          $ref: '#/components/schemas/DelegateId'
      required:
      - eserviceId
      - delegateId
    ProducerDelegation_2:
