openapi: 3.2.0
info:
  title: GPD Upload pagoPA - Massive Upload Massive operation APIs…
  description: API to support Debt Positions massive upload for organizations
  termsOfService: https://www.pagopa.gov.it/
  version: 1.2.4
servers:
- url: https://api.platform.pagopa.it/upload/gpd/debt-positions-service/v2
security:
- apiKeyHeader: []
- apiKeyQuery: []
tags:
- name: Massive operation APIs for Debt Positions - v2
paths:
  /brokers/{broker-code}/organizations/{organization-fiscal-code}/debtpositions/file:
    put:
      tags:
      - Massive operation APIs for Debt Positions - v2
      summary: The Organization updates the debt positions listed in the file
      description: The Organization updates the debt positions listed in the file.
      operationId: update-debt-positions-by-file-upload
      parameters:
      - name: broker-code
        in: path
        description: The broker code
        required: true
        schema:
          minLength: 1
          type: string
      - name: organization-fiscal-code
        in: path
        description: The organization fiscal code
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  description: File to be uploaded
                  format: binary
      responses:
        '202':
          description: Request accepted.
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                title: string
                status: 400
                detail: There was an error processing the request
        '401':
          description: Wrong or missing function key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                title: string
                status: 400
                detail: There was an error processing the request
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Too many requests.
          content:
            text/json: {}
        '500':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                title: string
                status: 400
                detail: There was an error processing the request
    post:
      tags:
      - Massive operation APIs for Debt Positions - v2
      summary: The Organization creates the debt positions listed in the file
      description: The Organization creates the debt positions listed in the file.
      operationId: create-debt-positions-by-file-upload
      parameters:
      - name: broker-code
        in: path
        description: The broker code
        required: true
        schema:
          minLength: 1
          type: string
      - name: organization-fiscal-code
        in: path
        description: The organization fiscal code
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  description: File to be uploaded
                  format: binary
      responses:
        '202':
          description: Request accepted.
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                title: string
                status: 400
                detail: There was an error processing the request
        '401':
          description: Wrong or missing function key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                title: string
                status: 400
                detail: There was an error processing the request
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Too many requests.
          content:
            text/json: {}
        '500':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                title: string
                status: 400
                detail: There was an error processing the request
    delete:
      tags:
      - Massive operation APIs for Debt Positions - v2
      summary: The Organization deletes the debt positions based on IUPD listed in the file
      description: The Organization deletes the debt positions based on IUPD listed in the file.
      operationId: delete-debt-positions-by-file-upload
      parameters:
      - name: broker-code
        in: path
        description: The broker code
        required: true
        schema:
          minLength: 1
          type: string
      - name: organization-fiscal-code
        in: path
        description: The organization fiscal code
        required: true
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  description: File to be uploaded
                  format: binary
      responses:
        '202':
          description: Request accepted.
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                title: string
                status: 400
                detail: There was an error processing the request
        '401':
          description: Wrong or missing function key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                title: string
                status: 400
                detail: There was an error processing the request
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Too many requests.
          content:
            text/json: {}
        '500':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                title: string
                status: 400
                detail: There was an error processing the request
components:
  schemas:
    ProblemJson:
      type: object
      properties:
        title:
          type: string
          description: 'A short, summary of the problem type. Written in english and readable for engineers (usually not suited for non technical stakeholders and not localized); example: Service Unavailable'
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          format: int32
          example: 400
        detail:
          type: string
          description: A human readable explanation specific to this occurrence of the problem.
          example: There was an error processing the request
      description: Object returned as response in case of an error.
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
    apiKeyQuery:
      type: apiKey
      name: subscription-key
      in: query
