openapi: 3.2.0
info:
  title: Pagopa Agreements API
  contact:
    name: API Support
    url: https://github.com/pagopa/pdnd-interop-frontend/issues
  termsOfService: https://selfcare.interop.pagopa.it/ui/it/termini-di-servizio
  x-summary: PDND Interoperability API
  version: '1.0'
  description: 'Operations tagged agreements across 3 of this provider''s published API definitions: interop-api-v3.yaml, pagopa-pdnd-interop-v2-openapi.yml, pagopa-pdnd-interop-v3-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.interop.pagopa.it/v3
  description: Production environment
- url: https://api.interop.pagopa.it/v2
  description: PROD environment
tags:
- name: Agreements
  description: Agreements routes
paths:
  /agreements:
    get:
      tags:
      - Agreements
      summary: List Agreements
      description: Retrieve a list of Agreements based on filters
      operationId: getAgreements
      parameters:
      - in: query
        name: states
        description: Filter Agreements by states. If not specified, return Agreements in any state
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AgreementState'
          default: []
        explode: false
      - in: query
        name: producerIds
        description: Filter Agreements by producer IDs. If not specified, return Agreements for any producer
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          default: []
        explode: false
      - in: query
        name: consumerIds
        description: Filter Agreements by consumer IDs. If not specified, return Agreements for any consumer
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          default: []
        explode: false
      - in: query
        name: descriptorIds
        description: Filter Agreements by Descriptor IDs. If not specified, return Agreements for any Descriptor
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DescriptorId'
          default: []
        explode: false
      - $ref: '#/components/parameters/EserviceIdsParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Agreements retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreements'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    post:
      tags:
      - Agreements
      summary: Create a new Agreement
      description: Create a new Agreement in Draft state
      operationId: createAgreement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementSeed'
        required: true
      responses:
        '201':
          description: Agreement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}:
    parameters:
    - name: agreementId
      in: path
      description: The ID of the Agreement
      required: true
      schema:
        $ref: '#/components/schemas/AgreementId'
    get:
      tags:
      - Agreements
      summary: Retrieve an Agreement
      operationId: getAgreement
      responses:
        '200':
          description: Agreement retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    delete:
      tags:
      - Agreements
      summary: Delete an Agreement
      description: Delete an Agreement in Draft, Pending, or MissingCertifiedAttributes state
      operationId: deleteAgreement
      responses:
        '200':
          description: Agreement deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidObject'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/purposes:
    parameters:
    - name: agreementId
      in: path
      description: The ID of the Agreement to retrieve purposes for
      required: true
      schema:
        $ref: '#/components/schemas/AgreementId'
    get:
      tags:
      - Agreements
      summary: List Purposes for an Agreement
      description: Retrieve a list of Purposes associated with an Agreement
      operationId: getAgreementPurposes
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Purposes retrieved for the Agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purposes'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/approve:
    parameters:
    - schema:
        $ref: '#/components/schemas/AgreementId'
      name: agreementId
      description: The ID of the Agreement to approve
      in: path
      required: true
    post:
      tags:
      - Agreements
      summary: Approve an Agreement in Pending state
      description: Approve an Agreement that is in Pending state, transitioning it to Active state
      operationId: approveAgreement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationRef'
      responses:
        '200':
          description: Agreement approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/reject:
    parameters:
    - schema:
        $ref: '#/components/schemas/AgreementId'
      name: agreementId
      description: The ID of the Agreement to reject
      in: path
      required: true
    post:
      tags:
      - Agreements
      summary: Reject an Agreement in Pending state
      description: Reject an Agreement that is in Pending state, transitioning it to Rejected state
      operationId: rejectAgreement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementRejection'
        required: true
      responses:
        '200':
          description: Agreement rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/archive:
    parameters:
    - schema:
        $ref: '#/components/schemas/AgreementId'
      name: agreementId
      description: The ID of the Agreement to archive
      in: path
      required: true
    post:
      tags:
      - Agreements
      summary: Archive an Agreement in Active or Suspended state
      description: 'Archive an Agreement that is in Active or Suspended state, transitioning it to Archived state.

        The Archived state is not reversible.'
      operationId: archiveAgreement
      responses:
        '200':
          description: Agreement archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/submit:
    parameters:
    - schema:
        $ref: '#/components/schemas/AgreementId'
      name: agreementId
      description: The ID of the Agreement to submit
      in: path
      required: true
    post:
      tags:
      - Agreements
      summary: Submit an Agreement in Draft state
      description: Submit an Agreement that is in Draft state, transitioning it to Active state if all requirements are satisfied, to Pending otherwise
      operationId: submitAgreement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementSubmission'
        description: payload for agreement submission
        required: true
      responses:
        '200':
          description: Draft agreement submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/suspend:
    parameters:
    - schema:
        $ref: '#/components/schemas/AgreementId'
      name: agreementId
      description: The ID of the Agreement to suspend
      in: path
      required: true
    post:
      tags:
      - Agreements
      summary: Suspend an Agreement in Active or Suspended state
      description: 'Suspend an Agreement that is in Active or Suspended state, transitioning it to Suspended state

        An Agreement may already be in Suspended state when previously suspended by the consumer or the producer'
      operationId: suspendAgreement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationRef'
      responses:
        '200':
          description: Active agreement suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/unsuspend:
    parameters:
    - schema:
        $ref: '#/components/schemas/AgreementId'
      name: agreementId
      description: The ID of the Agreement to unsuspend
      in: path
      required: true
    post:
      tags:
      - Agreements
      summary: Unsuspend an Agreement in Suspended state
      description: 'Unsuspend an Agreement that is in Suspended state, transitioning it to Active or Suspended state

        An Agreement may remain in Suspended state when suspended also by the consumer or the producer'
      operationId: unsuspendAgreement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationRef'
      responses:
        '200':
          description: Agreement unsuspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/upgrade:
    parameters:
    - name: agreementId
      in: path
      description: The ID of the Agreement to upgrade
      required: true
      schema:
        $ref: '#/components/schemas/AgreementId'
    post:
      tags:
      - Agreements
      summary: Upgrade an Agreement
      description: 'Upgrade the Agreement to a newer E-Service version, if available

        The current Agreement will be archived and a new Agreement will be created, in the same state'
      operationId: upgradeAgreement
      responses:
        '200':
          description: Agreement upgraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/clone:
    parameters:
    - name: agreementId
      in: path
      description: The ID of the Agreement to clone
      required: true
      schema:
        $ref: '#/components/schemas/AgreementId'
    post:
      tags:
      - Agreements
      summary: Clone an Agreement
      description: 'Clone a rejected Agreement.

        A new draft Agreement will be created'
      operationId: cloneAgreement
      responses:
        '200':
          description: Agreement cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    servers:
    - url: https://api.interop.pagopa.it/v3
      description: Production environment
  /agreements/{agreementId}/consumerDocuments:
    parameters:
    - name: agreementId
      in: path
      description: The ID of the Agreement
      required: true
      schema:
        $ref: '#/components/schemas/AgreementId'
    post:
      tags:
      - Agreements
      summary: Upload an Agreement Consumer Document
      description: Upload a Consumer Document for the specified Agreement
      operationId: uploadAgreementConsumerDocument
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadMultipart'
        required: true
      responses:
        '201':
          description: Consumer Document uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - DPoPAuth: []
        DPoPProofHeader: []
    get:
      tags:
      - Agreements
      summary: List Agreement Consumer Documents
      description: Retrieve a list of Consumer Documents for the specified Agreement
      operationId: getAgreementConsumerDocuments
      parameters:
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Consumer Documents retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documents'
          headers:
            X-Rate-Limit-Limit:
              $ref: '#/components/headers/RateLimitLimitHeader'
            X-Rate-Limit-Remaining:
              $ref: '#/components/headers/RateLimitRemainingHeader'
            X-Rate-Limit-Interval:
              $ref: '#/components/headers/RateLimitIntervalHeader'
            Digest:
              $ref: '#/components/headers/IntegrityRest02DigestHeader'
            Agid-JWT-Signature:
              $ref: '#/components/headers/IntegrityRest02AgidJwtSignatureHeader'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
