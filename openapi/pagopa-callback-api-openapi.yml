openapi: 3.2.0
info:
  title: Pagopa Callback API
  version: 0.0.1
  contact:
    email: cstar@pagopa.it
  description: 'Operations tagged callback across 2 of this provider''s published API definitions: srtp-callback.yaml, pagopa-srtp-callback-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Development/Test
  url: https://api-rtp-cb.dev.cstar.pagopa.it/rtp/cb/v1
  x-internal: true
- description: User Acceptance Test
  url: https://api-rtp-cb.uat.cstar.pagopa.it/rtp/cb/v1
  x-internal: false
- description: Production
  url: https://api-rtp-cb.cstar.pagopa.it/rtp/cb/v1
  x-internal: false
tags:
- name: Callback
  description: API Group aims to get the callback.
paths:
  /send:
    post:
      summary: Forwarding of a SEPA Request-To-Pay Response to the Payee's SRTP Service…
      description: 'This endpoint is called by the Payer''s SRTP-SP to forward a SEPA Request-To-Pay Response

        to the Payee''s SRTP-SP through the callback URL provided during the initial request.


        Sections 2.2, 2.3, 2.5 & 2.6 in SRTP Implementation guidelines 3.0'
      operationId: sendCallback
      tags:
      - Callback
      requestBody:
        description: ISO20022 based SEPA Request-To-Pay Response
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsynchronousSepaRequestToPayResponseResource'
        required: true
      responses:
        '200':
          description: OK - Our server has received and accepted the client's notification.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - description: Development/Test
      url: https://api-rtp-cb.dev.cstar.pagopa.it/rtp/cb/v1
      x-internal: true
    - description: User Acceptance Test
      url: https://api-rtp-cb.uat.cstar.pagopa.it/rtp/cb/v1
      x-internal: false
    - description: Production
      url: https://api-rtp-cb.cstar.pagopa.it/rtp/cb/v1
      x-internal: false
