components:
  schemas:
    SignalPullResponse:
      type: object
      properties:
        signals:
          type: array
          items:
            type: object
            properties:
              signalType:
                $ref: '#/components/schemas/signalType'
              objectId:
                type: string
              eserviceId:
                type: string
              signalId:
                type: number
              objectType:
                type: string
            required:
            - signalType
            - objectId
            - eserviceId
            - signalId
            - objectType
        lastSignalId:
          type:
          - number
          - 'null'
      required:
      - signals
    problem:
      type: object
      properties:
        type:
          type: string
        status:
          type: number
        title:
          type: string
        correlationId:
          type:
          - string
          - 'null'
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - type
      - status
      - title
      - detail
      - errors
    signalType:
      type: string
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - SEEDUPDATE
    SignalPayload:
      type: object
      properties:
        signalType:
          $ref: '#/components/schemas/signalType'
        objectId:
          type: string
        eserviceId:
          type: string
        signalId:
          type: number
        objectType:
          type: string
      required:
      - signalType
      - objectId
      - eserviceId
      - signalId
      - objectType
    SignalPushResponse:
      type: object
      properties:
        signalId:
          type: number
      required:
      - signalId
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A bearer token in the format of a JWS and conformed to the specifications included in [RFC8725](https://tools.ietf.org/html/RFC8725).
